root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -buildvcs=false -o ./tmp/email-summary-tool ./main"
entrypoint = ["./tmp/email-summary-tool"]
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["tmp", "vendor", ".git", "frontend"]
exclude_regex = ["_test\\.go"]
delay = 200
stop_on_error = true
send_interrupt = true
kill_delay = 500000000

[misc]
clean_on_exit = true
