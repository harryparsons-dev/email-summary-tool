# Production stack. Run on the server with:
#   docker compose -f compose.prod.yaml up --build --detach
#
# Only the web service (80/443) and inbound SMTP (25) are published. The API
# and PostgreSQL are reachable only on the internal Compose network.

name: email-summary-tool-prod

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    env_file:
      - .env
    environment:
      # The site is served over HTTPS, so auth cookies must be HTTPS-only.
      COOKIE_SECURE: "true"
      SMTP_ADDR: ":2525"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "25:2525"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env to the domain the app is served on}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Holds the TLS certificates; keep it across deploys.
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
