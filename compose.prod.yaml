# Production stack. Run on the server with:
#   docker compose -f compose.prod.yaml up --build --detach
#
# Only the web service (80/443) and inbound SMTP (25) are published. The API
# and PostgreSQL are reachable only on the internal Compose network.

name: mailai-prod

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    # Variables are listed one by one so the API never receives the PostgreSQL
    # superuser password; it connects as the restricted DB_USER role.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      INBOUND_EMAIL_DOMAIN: ${INBOUND_EMAIL_DOMAIN:?Set INBOUND_EMAIL_DOMAIN in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The site is served over HTTPS, so auth cookies must be HTTPS-only.
      COOKIE_SECURE: "true"
      SMTP_ADDR: ":2525"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "25:2525"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env to the domain the app is served on}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Holds the TLS certificates; keep it across deploys.
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      # Superuser, for administration only. The API does not use it.
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Role created for the API by database/initdb on first start.
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
